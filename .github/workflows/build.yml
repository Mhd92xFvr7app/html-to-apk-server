name: Build APK

on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'App Name'
        required: true
        default: 'MyApp'
      pkgId:
        description: 'Package ID'
        required: true
        default: 'com.example.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Build APK
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "${{ github.event.inputs.appName }}" "${{ github.event.inputs.pkgId }}" --web-dir www
          npx cap add android
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
